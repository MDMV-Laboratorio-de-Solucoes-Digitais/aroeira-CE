[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "libs/domain",
    "libs/infra",
    "libs/migration",
]

[workspace.package]
version = "0.1.0-alpha"
authors = ["MDMV - Laboratório de Soluções Digitais <lfgranjaead@gmail.com>"]
edition = "2024"
license = "MIT"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Local Crates
domain = { path = "libs/domain" }
infra = { path = "libs/infra" }
migration = { path = "libs/migration" }

# Async Runtime & Web Framework
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"
eyre = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sea-orm = { version = "2.0.0-rc.30", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }

# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-build = { version = "2.5.3", features = [] }
tauri-plugin-shell = "2.3.4"
tauri-plugin-opener = "2.5"
tauri-plugin-secure-storage = "1.4"

# Cryptography & Security
bcrypt = "0.18.0"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
secrecy = { version = "0.10", features = ["serde"] }

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
regex = "1.12.2"
hex = "0.4.3"
once_cell = "1.21.3"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }
async-trait = "0.1.89"
lazy_static = "1.5.0"
which = "8.0"
dirs = "6.0"
walkdir = "2.5.0"
libc = "0.2"
rand = "0.9"
winreg = "0.55"

# Testing
proptest = "1.9"
tempfile = "3.24"

# Windows-sys
windows-sys = "0.61"

# ==============================================================
# Build Profiles
# ==============================================================

# CI Profile: Fast builds for PR validation (inherits from dev)
[profile.ci]
inherits = "dev"
debug = 1           # Apenas line tables para backtraces melhores em caso de pânico
opt-level = 0       # No optimizations (fastest compile)
incremental = true  # Enable incremental compilation

# Release Profile: Optimized for production binaries
[profile.release]
strip = true        # Strip symbols from binary
lto = "thin"        # Thin LTO (bom balanço entre tempo de compilação e performance)
codegen-units = 1   # Single codegen unit for better optimization
opt-level = 3       # Maximum optimization
panic = "abort"     # Abort on panic (smaller binary)

# Dev profile: fast compilation, slow runtime (acceptable for dev)
[profile.dev]
opt-level = 0
incremental = true
