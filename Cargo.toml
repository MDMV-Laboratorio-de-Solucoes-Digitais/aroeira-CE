[workspace.dependencies]
# Local Crates
domain = { path = "libs/domain" }
infra = { path = "libs/infra" }
migration = { path = "libs/migration" }

# Async Runtime & Web Framework
tokio = { version = "1.49", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
futures = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sea-orm = { version = "2.0.0-rc.30", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }

# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-build = { version = "2.5.3", features = [] }
tauri-plugin-shell = "2.3.4"
tauri-plugin-opener = "2.5"
tauri-plugin-secure-storage = "1.4"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

# Cryptography & Security
bcrypt = "0.18.0"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
secrecy = { version = "0.10", features = ["serde"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
url = "2.5"

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
regex = "1.12.2"
which = "8.0"
dirs = "6.0"
walkdir = "2.5.0"
libc = "0.2"
rand = "0.9"
winreg = "0.55"
keyring = "3.6.3"
dotenvy = "0.15"

# Force unique versions to reduce duplicate dependencies
hashbrown = "0.16"
indexmap = "2.13"
syn = "2.0"
heck = "0.5"
darling = "0.21"
derive_more = "2.1"
siphasher = "1.0"
winnow = "0.7"
getrandom = "0.3"
rand_core = "0.9"
rand_chacha = "0.9"
bitflags = "2.10"

# Testing
proptest = "1.9"
tempfile = "3.24"

# Windows-sys
windows-sys = "0.61"

# ==============================================================
# Build Profiles
# ==============================================================

# CI Profile: Fast builds for PR validation (inherits from dev)
[profile.ci]
inherits = "dev"
debug = 1          # Line tables only for better backtraces on panic
opt-level = 0      # No optimizations (fastest compile)
incremental = true # Enable incremental compilation

# Release Profile: Optimized for production binaries
[profile.release]
strip = true      # Strip symbols from binary
lto = "thin"      # Thin LTO (good balance between compilation time and performance)
codegen-units = 1 # Single codegen unit for better optimization
opt-level = 3     # Maximum optimization
panic = "abort"   # Abort on panic (smaller binary)

# Dev profile: fast compilation, slow runtime (acceptable for dev)
[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
