[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0098", reason = "Transitive from Tauri via urlpattern -> unic-ucd-ident" },
    { id = "RUSTSEC-2024-0411", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0412", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0413", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0414", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0415", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0416", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0417", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0418", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2024-0420", reason = "Transitive from Tauri via gtk-rs (GTK3 bindings)" },
    { id = "RUSTSEC-2025-0057", reason = "Transitive from Tauri via fxhash" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = [
    { crate = "syn@1.*" },
]
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
