[package]
name = "aroeira-oauth-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Aroeira Team"]
description = "BFF OAuth Proxy for GitHub - exchanges auth codes for tokens without exposing client secrets"
license = "MIT"

[[bin]]
name = "aroeira-oauth-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["limit", "buffer"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
validator = { version = "0.19", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url.workspace = true

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true
